name: lensless

on:
  push:
    paths:
      - 'waveprop/**'
      - 'tests/**'
      - 'examples/**'
      - 'profile/**'
      - 'setup.py'
      - 'environment.yml'
      - 'format_code.sh'
      - '.pre-commit-config.yaml'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'waveprop/**'
      - 'tests/**'
      - 'examples/**'
      - 'profile/**'
      - 'setup.py'
      - 'environment.yml'
      - 'format_code.sh'
      - '.pre-commit-config.yaml'
      - '.github/workflows/**'

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install black
        run: python -m pip install --upgrade pip && pip install "black==24.10.0"
      - name: Check formatting
        run: |
          black --check --line-length 100 setup.py
          black --check --line-length 100 waveprop/
          black --check --line-length 100 tests/
          black --check --line-length 100 examples/
          black --check --line-length 100 profile/

  build:
    needs: format
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
    - uses: actions/checkout@v3
    - name: Checkout submodules
      shell: bash
      run: |
        auth_header="$(git config --local --get http.https://github.com/.extraheader)"
        git submodule sync --recursive
        git -c "http.extraheader=$auth_header" -c protocol.version=2 submodule update --init --force --recursive --depth=1
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies and build package
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e .
    - name: Test with pytest
      run: |
        pip install -U pytest
        pytest
